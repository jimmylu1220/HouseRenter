services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jimmylu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jimmylu}
      POSTGRES_DB: ${POSTGRES_DB:-houserenter}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jimmylu} -d ${POSTGRES_DB:-houserenter}"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      DATABASE_URL: postgresql://${POSTGRES_USER:-jimmylu}:${POSTGRES_PASSWORD:-jimmylu}@db:5432/${POSTGRES_DB:-houserenter}
      # Facebook 爬蟲（選填）— 留空 FACEBOOK_GROUPS 即停用
      FACEBOOK_GROUPS: ${FACEBOOK_GROUPS:-}
      FACEBOOK_STATE_PATH: /secrets/fb_state.json
      FACEBOOK_MAX_POSTS_PER_GROUP: ${FACEBOOK_MAX_POSTS_PER_GROUP:-30}
      FACEBOOK_INTERVAL_MINUTES: ${FACEBOOK_INTERVAL_MINUTES:-15}
      FACEBOOK_ADMIN_CHAT_ID: ${FACEBOOK_ADMIN_CHAT_ID:-}
      # Discord 頻道通知（選填）— 留空 DISCORD_WEBHOOK_URL 即停用
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      DISCORD_MIRROR_CHAT_ID: ${DISCORD_MIRROR_CHAT_ID:-}
    # 用 scripts/fb_login.py 產生的登入狀態放在 host 的 ./secrets/fb_state.json。
    # 可寫入：爬蟲會把更新後的 cookie 寫回，延長登入壽命。
    volumes:
      - ./secrets:/secrets
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-jimmylu}:${POSTGRES_PASSWORD:-jimmylu}@db:5432/${POSTGRES_DB:-houserenter}
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  pgdata:
